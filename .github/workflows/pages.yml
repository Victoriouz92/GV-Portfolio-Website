# Publishes the site to GitHub Pages on every push (including edits from the admin panel),
# generating a real page for every work so each can be found and shared on its own.
name: Publish site

on:
  push:
    branches: [claude/glass-art-ecommerce-site-v7v6o6, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check catalogue and checkout without sending orders
        run: npm ci --prefix .github/tests && npm test --prefix .github/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python .github/scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
